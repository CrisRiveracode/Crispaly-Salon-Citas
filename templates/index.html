<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crispaly Salon</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #fdfcf9;
    font-family: 'Montserrat', sans-serif;
    color: #333;
}

/* PORTADA */
.portada {
    height: 180px;
    background: url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9') center/cover;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-family: 'Playfair Display', serif;
    color: #b8965a;
    margin: 0;
}

/* TARJETAS */
.card {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #e5d3b3;
}

/* BOTONES */
button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

.btn-main {
    background: linear-gradient(135deg, #d4af37, #b8965a);
    color: white;
}

.btn-wa {
    background: #25D366;
    color: white;
}

/* HORARIOS */
.horario {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
}
</style>
</head>

<body>

<div class="portada"></div>

<div class="container">

<div class="header">
    <h1>Crispaly Salon</h1>
</div>

<form class="card" id="reserva">
    <input type="text" id="nombre" placeholder="Nombre" aria-label="Nombre" maxlength="100" required>

    <input type="tel" id="contacto" placeholder="Teléfono de contacto" aria-label="Teléfono de contacto" maxlength="100" required>
    <select id="servicio" aria-label="Servicio" required>
        <option value="">Selecciona servicio</option>
        <option>Corte</option>
        <option>Tinte</option>
        <option>Balayage</option>
        <option>Depilación</option>
    </select>

    <input type="date" id="fecha" aria-label="Fecha" required>
    <select id="hora" aria-label="Hora" required></select>

    <button type="submit" id="agendar" class="btn-main">Agendar cita</button>
    <p id="mensaje" role="status" aria-live="polite"></p>
    <button type="button" class="btn-wa" onclick="irWhats()">WhatsApp</button>
</form>

<div class="card">
    <h3 style="color:#b8965a;">Horarios disponibles</h3>
    <div id="horarios">Selecciona una fecha</div>
</div>

</div>

<script>
const selectHora = document.getElementById('hora');
const inputFecha = document.getElementById('fecha');
const horariosDiv = document.getElementById('horarios');

const formulario = document.getElementById('reserva');
const mensaje = document.getElementById('mensaje');
const agendar = document.getElementById('agendar');
const hoy = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Mexico_City', year: 'numeric', month: '2-digit', day: '2-digit'
}).format(new Date());
inputFecha.min = hoy;
let carga = 0;

function generarHoras(fecha) {
    if (!fecha) return [];
    const dia = new Date(fecha + 'T12:00:00').getDay();
    if (dia === 0) return [];
    const fin = dia === 6 ? 15 : 19;
    return Array.from({length: fin - 10}, (_, i) => `${10 + i}:00`);
}

async function cargarHorarios(fecha) {
    const solicitud = ++carga;
    selectHora.replaceChildren();
    agendar.disabled = true;
    horariosDiv.textContent = fecha ? 'Cargando horarios…' : 'Selecciona una fecha';
    if (!fecha) return;
    try {
        const respuesta = await fetch('/horarios_ocupados/' + encodeURIComponent(fecha));
        if (!respuesta.ok) throw new Error('No pudimos consultar los horarios. Intenta de nuevo.');
        const ocupados = await respuesta.json();
        if (solicitud !== carga) return;
        const ahora = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }).format(new Date());
        const horas = generarHoras(fecha).filter(h => !ocupados.includes(h)
            && fecha >= hoy && (fecha !== hoy || h > ahora));
        horariosDiv.replaceChildren();
        if (!horas.length) {
            horariosDiv.textContent = 'No hay horarios disponibles para esta fecha.';
            return;
        }
        horas.forEach(h => {
            selectHora.add(new Option(h, h));
            const div = document.createElement('div');
            div.className = 'horario';
            div.textContent = `${h} — Disponible`;
            horariosDiv.appendChild(div);
        });
        agendar.disabled = false;
    } catch (error) {
        if (solicitud === carga) horariosDiv.textContent = error.message;
    }
}

inputFecha.addEventListener('change', () => cargarHorarios(inputFecha.value));
formulario.addEventListener('submit', async event => {
    event.preventDefault();
    if (!formulario.reportValidity() || agendar.disabled) return;
    const fecha = inputFecha.value;
    const hora = selectHora.value;
    agendar.disabled = true;
    mensaje.textContent = 'Guardando tu cita…';
    try {
        const respuesta = await fetch('/crear_cita', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                nombre: document.getElementById('nombre').value.trim(),
                contacto: document.getElementById('contacto').value.trim(),
                servicios: [document.getElementById('servicio').value], fecha, hora
            })
        });
        const resultado = await respuesta.json();
        if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo guardar la cita.');
        mensaje.textContent = `¡Cita confirmada! Te esperamos el ${fecha} a las ${hora}.`;
    } catch (error) {
        mensaje.textContent = error.message || 'No se pudo conectar. Intenta de nuevo.';
    } finally {
        await cargarHorarios(inputFecha.value);
    }
});
cargarHorarios('');

function irWhats() {
    const mensaje = encodeURIComponent("Hola, quiero agendar una cita");
    window.open(`https://wa.me/523315370476?text=${mensaje}`, "_blank");
}
</script>

</body>
</html>
